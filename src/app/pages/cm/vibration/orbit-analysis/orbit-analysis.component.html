<app-analysis-workspace [state]="state" [headerContent]="header">
  <ng-template let-tab>
    @if (!tab.orbitCapture) {
      <div class="text-gray-500 text-center py-10" role="status">Select a date and event time above to load the recorded measurement data.</div>
    } @else {
      @for (pair of tab.orbitPairs; track pair.key) {
        <section [attr.aria-labelledby]="tab.id + pair.key">
          @if (!$first) { <div class="separator my-7"></div> }
          <app-vibration-orbit-chart [pair]="pair" [titleId]="tab.id + pair.key" [settings]="tab.orbitSettings || defaults"
            [selection]="tab.orbitCapture"></app-vibration-orbit-chart>
        </section>
      }
    }
  </ng-template>
</app-analysis-workspace>
<ng-template #header let-tab>
  <app-orbit-analysis-controls [tab]="tab"></app-orbit-analysis-controls>
</ng-template>
