<!--begin::Table-->
<div class="card card-flush mt-6 mt-xl-9">
  <!--begin::Card header-->
  <div class="card-header mt-5">
    <!--begin::Card title-->
    <div class="card-title flex-column">
      <h3 class="fw-bold mb-1">System</h3>
    </div>
    <!--begin::Card title-->
    <!--begin::Card toolbar-->
    <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
        <input type="text" [disabled]="listState.loading()" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search System" #tableSearch (input)="table.search(tableSearch.value)" aria-label="Search System" />
      </div>
      <!--end::Search-->
      <!--begin::Employer filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select [disabled]="saving || !employersState.ready" class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
          <option [ngValue]="null">All Employers</option>
          <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
        </select>
      </div>
      <!--end::Employer filter-->
      <!--begin::Unit filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select [disabled]="saving || !listState.ready" class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by unit" [ngModel]="unitFilter" (ngModelChange)="filterByUnit($event)">
          <option [ngValue]="null">All Units</option>
          <option *ngFor="let u of unitOptions" [ngValue]="u.id">{{ u.label }}</option>
        </select>
      </div>
      <!--end::Unit filter-->
      <!--begin::Button-->
      <button type="button" [disabled]="!canAdd" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddModal(systemModal)">Add System</button>
      <!--end::Button-->
    </div>
    <!--begin::Card toolbar-->
  </div>
  <!--end::Card header-->
  <!--begin::Card body-->
  <div class="card-body pt-0">
    <app-request-feedback [state]="employersState" loadingMessage="Loading employers..." [retryDisabled]="saving" (retry)="loadEmployerOptions()"></app-request-feedback>
    <div *ngIf="listState.ready && unitOptions.length === 0" class="alert alert-warning">Add a <a routerLink="/asset-taxonomy/unit" class="alert-link">Unit</a> before creating a System.</div>
    <!--begin::Table container-->
    <app-data-table
      [table]="table"
      [loading]="listState.loading()"
      [error]="listState.error()"
      [actionsDisabled]="actionsDisabled"
      [retryDisabled]="saving"
      emptyMessage="No systems yet."
      (retry)="refresh()"
      tableId="kt_profile_overview_table"
      (editRecord)="openEditModal(systemModal, $event)"
      (deleteRecord)="table.confirmDelete($event, $event.name)">
    </app-data-table>
    <!--end::Table container-->
  </div>
  <!--end::Card body-->
</div>
<!--end::Card-->

<!--begin::Modal - System (Add / Edit)-->
<ng-template #systemModal let-modal>
  <app-form-modal
    #formModal
    [title]="systemForm.id ? 'Edit System' : 'Add System'"
    [formId]="systemForm.id ? 'kt_modal_edit_system_form' : 'kt_modal_add_system_form'"
    [submitLabel]="systemForm.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submit(systemNgForm, modal)" #systemNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_system'">
          <span class="required">System Name</span>
        </label>
        <!--end::Label-->
        <input
          [id]="formModal.formId + '_system'"
          type="text"
          class="form-control form-control-solid"
          placeholder="Enter System Name"
          name="system"
          [(ngModel)]="systemForm.name"
          required
          #systemControl="ngModel"
          [class.is-invalid]="systemControl.invalid && (systemControl.touched || systemNgForm.submitted)"
          [attr.aria-invalid]="(systemControl.invalid && (systemControl.touched || systemNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(systemControl.invalid && (systemControl.touched || systemNgForm.submitted)) ? (formModal.formId + '_system_error') : null"
          appTrimmedRequired />
        <div *ngIf="systemControl.invalid && (systemControl.touched || systemNgForm.submitted)" [id]="formModal.formId + '_system_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter system name.</div>
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-15 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_unit'">
          <span class="required">Unit Name</span>
        </label>
        <!--end::Label-->
        <select
          [id]="formModal.formId + '_unit'"
          class="form-select form-select-solid"
          data-control="select2"
          data-placeholder="Select a Unit"
          name="unit"
          [(ngModel)]="systemForm.unitId"
          required
          aria-label="Unit Name"
          #unitControl="ngModel"
          [class.is-invalid]="unitControl.invalid && (unitControl.touched || systemNgForm.submitted)"
          [attr.aria-invalid]="(unitControl.invalid && (unitControl.touched || systemNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(unitControl.invalid && (unitControl.touched || systemNgForm.submitted)) ? (formModal.formId + '_unit_error') : null">
          <option [ngValue]="null">Select unit...</option>
          <option *ngFor="let u of unitOptions" [ngValue]="u.id">{{ u.label }}</option>
        </select>
        <div *ngIf="unitControl.invalid && (unitControl.touched || systemNgForm.submitted)" [id]="formModal.formId + '_unit_error'" class="fv-plugins-message-container invalid-feedback d-block">Select unit name.</div>
      </div>
      <!--end::Input group-->
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - System (Add / Edit)-->
