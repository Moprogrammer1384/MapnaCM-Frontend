<!--begin::Row-->
<div class="row gx-5 gx-xl-10">
  <div class="col-12 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Measurement</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Measurement" #tableSearch (input)="table.search(tableSearch.value)" />
          </div>
          <!--end::Search-->
          <!--begin::Employer filter-->
          <div class="my-1 me-md-4 w-100 w-md-250px">
            <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
              <option [ngValue]="null">All Employers</option>
              <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
            </select>
          </div>
          <!--end::Employer filter-->
          <!--begin::Component filter-->
          <div class="my-1 me-md-4 w-100 w-md-250px">
            <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by component" [ngModel]="componentFilter" (ngModelChange)="filterByComponent($event)">
              <option [ngValue]="null">All Components</option>
              <option *ngFor="let s of componentOptions" [ngValue]="s.id">{{ s.label }}</option>
            </select>
          </div>
          <!--end::Component filter-->
          <div class="my-1 me-md-4 w-100 w-md-150px">
            <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by measurement type" [ngModel]="typeFilter" (ngModelChange)="filterByType($event)">
              <option [ngValue]="null">All Types</option>
              <option *ngFor="let type of typeOptions" [ngValue]="type.id">{{ type.name }} ({{ type.unit }})</option>
            </select>
          </div>
          <!--begin::Button-->
          <a href="javascript:;" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddModal(measurementModal)">Add Measurement</a>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <!--begin::Table container-->
        <app-data-table
          [table]="table"
          tableId="kt_measurement_table"
          (editRecord)="openEditModal(measurementModal, $event)"
          (deleteRecord)="table.confirmDelete($event, $event.name)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <div class="col-12 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Measurement Type</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" id="kt_measurement_type_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Type" aria-label="Search measurement types" #typesSearch (input)="types.search(typesSearch.value)" />
          </div>
          <!--end::Search-->
          <!--begin::Button-->
          <a href="javascript:;" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddTypeModal(typeModal)">Add Type</a>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <!--begin::Table container-->
        <app-data-table
          [table]="types"
          tableId="kt_measurement_type_table"
          (editRecord)="openEditTypeModal(typeModal, $event)"
          (deleteRecord)="deleteType($event)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <!--end::Col-->
</div>
<!--end::Row-->

<!--begin::Modal - Measurement (Add / Edit)-->
<ng-template #measurementModal let-modal>
  <app-form-modal
    #formModal
    [title]="measurementForm.id ? 'Edit Measurement' : 'Add Measurement'"
    [formId]="measurementForm.id ? 'kt_modal_edit_measurement_form' : 'kt_modal_add_measurement_form'"
    [submitLabel]="measurementForm.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submit(measurementNgForm, modal)" #measurementNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2">
          <span class="required">Measurement Name</span>
        </label>
        <!--end::Label-->
        <input type="text" class="form-control form-control-solid" placeholder="Enter Measurement Name" name="measurement" [(ngModel)]="measurementForm.name" required />
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" for="measurement_tag">Tag</label>
        <input id="measurement_tag" type="text" class="form-control form-control-solid" placeholder="Enter Tag Name" name="tag" [(ngModel)]="measurementForm.tag" />
      </div>
      <div class="row g-5 g-md-9 mb-8">
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formModal.formId + '_type'">Type</label>
          <select [id]="formModal.formId + '_type'" class="form-select form-select-solid" data-control="select2" data-placeholder="Select a Type" name="measurementTypeId" [(ngModel)]="measurementForm.measurementTypeId" #measurementType="ngModel" required>
            <option [ngValue]="null">Select type...</option>
            <option *ngFor="let type of typeOptions" [ngValue]="type.id">{{ type.name }} ({{ type.unit }})</option>
          </select>
          <div *ngIf="typeOptions.length === 0" class="form-text">Add a Measurement Type with its name and unit first.</div>
          <div *ngIf="measurementType.invalid && (measurementType.touched || measurementNgForm.submitted)" class="fv-plugins-message-container invalid-feedback d-block">Select a measurement type.</div>
        </div>
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formModal.formId + '_sensitivity'">Sensitivity</label>
          <input [id]="formModal.formId + '_sensitivity'" type="number" step="any" class="form-control form-control-solid" placeholder="Enter Sensitivity" name="sensitivity" [(ngModel)]="measurementForm.sensitivity" #sensitivity="ngModel" required />
          <div *ngIf="sensitivity.invalid && (sensitivity.touched || measurementNgForm.submitted)" class="fv-plugins-message-container invalid-feedback d-block">Enter a number for sensitivity.</div>
        </div>
      </div>
      <div *ngIf="selectedTypeUnit" class="d-flex flex-column mb-8 fv-row">
        <label class="fs-6 fw-semibold mb-2" [for]="formModal.formId + '_unit'">Unit</label>
        <input [id]="formModal.formId + '_unit'" type="text" class="form-control form-control-solid" [value]="selectedTypeUnit" readonly />
      </div>
      <div class="d-flex flex-column mb-15 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2">
          <span class="required">Component Name</span>
        </label>
        <!--end::Label-->
        <select class="form-select form-select-solid" data-control="select2" data-placeholder="Select a Component" name="component" [(ngModel)]="measurementForm.componentId" required>
          <option [ngValue]="null">Select component...</option>
          <option *ngFor="let s of componentOptions" [ngValue]="s.id">{{ s.label }}</option>
        </select>
      </div>
      <!--end::Input group-->
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Measurement (Add / Edit)-->

<!--begin::Modal - Measurement Type (Add / Edit)-->
<ng-template #typeModal let-modal>
  <app-form-modal
    #formModal
    [title]="typeFormModel.id ? 'Edit Measurement Type' : 'Add Measurement Type'"
    [formId]="typeFormModel.id ? 'kt_modal_edit_measurement_type_form' : 'kt_modal_add_measurement_type_form'"
    [submitLabel]="typeFormModel.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submitType(typeNgForm, modal)" #typeNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2">
          <span class="required">Name</span>
        </label>
        <!--end::Label-->
        <input type="text" class="form-control form-control-solid" placeholder="Enter Type Name" name="name" [(ngModel)]="typeFormModel.name" required />
      </div>
      <!--end::Input group-->
      <div class="d-flex flex-column mb-15 fv-row">
        <label class="required fs-6 fw-semibold mb-2" [for]="formModal.formId + '_unit'">Unit</label>
        <input [id]="formModal.formId + '_unit'" type="text" class="form-control form-control-solid" placeholder="Enter Unit (e.g. mm/s)" name="unit" [(ngModel)]="typeFormModel.unit" required />
      </div>
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Measurement Type (Add / Edit)-->
