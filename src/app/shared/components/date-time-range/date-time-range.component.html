<label [for]="inputId + '_range'" class="visually-hidden">Date and time range</label>
<div class="input-group input-group-solid flex-nowrap">
  <input #rangeInput [id]="inputId + '_range'" type="text" class="form-control form-control-solid min-w-0"
    placeholder="Select date and time range" autocomplete="off" aria-haspopup="dialog" dir="ltr"
    [disabled]="disabled" [attr.aria-expanded]="isOpen" (click)="open()"
    (keydown.enter)="open(); $event.preventDefault()">
  <button type="button" class="btn btn-icon btn-light" aria-label="Choose date and time range"
    [disabled]="disabled" (click)="open()">
    <app-keenicon name="calendar-8" class="fs-2"></app-keenicon>
  </button>
</div>

<div #footer class="border-top p-4" (keydown)="onFooterKeydown($event)">
  <div class="row g-3" dir="ltr">
    <div *ngFor="let endpoint of endpoints; let i = index" class="col-6">
      <div class="fw-semibold text-gray-800 fs-7 mb-1">{{ endpoint === 'from' ? 'Start' : 'End' }}</div>
      <div class="text-gray-500 fs-8 mb-2">{{ draftDates[i] || 'Select date' }}</div>
      <div class="d-flex align-items-center gap-1">
        <div class="flex-grow-1 min-w-0">
          <label [for]="inputId + '_' + endpoint + '_hour'" class="text-gray-600 fs-8">Hour</label>
          <input [id]="inputId + '_' + endpoint + '_hour'" type="number" min="0" max="23" step="1"
            class="form-control form-control-sm form-control-solid px-2" [disabled]="disabled || selectionDisabled"
            [attr.aria-label]="(endpoint === 'from' ? 'Start' : 'End') + ' hour'"
            [attr.aria-describedby]="error ? inputId + '_error' : null" [attr.aria-invalid]="!!error"
            [(ngModel)]="times[endpoint].hour" [ngModelOptions]="{ standalone: true }" (ngModelChange)="error = ''">
        </div>
        <span class="text-gray-500 mt-5" aria-hidden="true">:</span>
        <div class="flex-grow-1 min-w-0">
          <label [for]="inputId + '_' + endpoint + '_minute'" class="text-gray-600 fs-8">Minute</label>
          <input [id]="inputId + '_' + endpoint + '_minute'" type="number" min="0" max="59" step="1"
            class="form-control form-control-sm form-control-solid px-2" [disabled]="disabled || selectionDisabled"
            [attr.aria-label]="(endpoint === 'from' ? 'Start' : 'End') + ' minute'"
            [attr.aria-describedby]="error ? inputId + '_error' : null" [attr.aria-invalid]="!!error"
            [(ngModel)]="times[endpoint].minute" [ngModelOptions]="{ standalone: true }" (ngModelChange)="error = ''">
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="error" [id]="inputId + '_error'" class="text-danger fs-7 mt-3" role="alert">{{ error }}</div>
  <div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-sm btn-light" (click)="close()">Cancel</button>
    <button type="button" class="btn btn-sm btn-primary" [disabled]="disabled || selectionDisabled" (click)="apply()">Apply</button>
  </div>
</div>
