<div class="card mb-5 mb-xl-10">
  <div
    class="card-header border-0 cursor-pointer"
    role="button"
    data-bs-toggle="collapse"
    data-bs-target="#kt_account_profile_details"
    aria-expanded="true"
    aria-controls="kt_account_profile_details"
  >
    <div class="card-title m-0">
      <h3 class="fw-bolder m-0">Profile Details</h3>
    </div>
  </div>
  <div id="kt_account_profile_details" class="collapse show">
    <form novalidate="" class="form" [formGroup]="form">
      <div class="card-body border-top p-9">
        <ng-container *ngIf="errorMessage">
          <div class="alert alert-danger">{{ errorMessage }}</div>
        </ng-container>

        <ng-container *ngIf="successMessage">
          <div class="alert alert-success">{{ successMessage }}</div>
        </ng-container>

        <div class="row mb-6">
          <label class="col-lg-4 col-form-label fw-bold fs-6">Avatar</label>
          <div class="col-lg-8">
            <div class="d-flex align-items-center gap-8">
              <!--begin::Preview-->
              <div class="image-input image-input-outline" data-kt-image-input="true">
                <div
                  class="image-input-wrapper w-125px h-125px"
                  [style.background-image]="'url(' + avatarPreview + ')'"
                ></div>
              </div>
              <!--end::Preview-->
              <!--begin::Actions-->
              <div class="d-flex flex-column align-items-start">
                <input
                  #avatarInput
                  type="file"
                  name="avatar"
                  accept=".png, .jpg, .jpeg, .webp"
                  class="d-none"
                  (change)="onAvatarChange($event)"
                />
                <button
                  type="button"
                  class="btn btn-light-primary btn-sm mb-2"
                  (click)="avatarInput.click()"
                >
                  <i class="ki-duotone ki-pencil fs-3">
                    <span class="path1"></span>
                    <span class="path2"></span>
                  </i>
                  Change Avatar
                </button>
                <button
                  type="button"
                  class="btn btn-light btn-sm"
                  [disabled]="!avatarFile"
                  (click)="cancelAvatar()"
                >
                  <i class="ki-duotone ki-cross fs-3">
                    <span class="path1"></span>
                    <span class="path2"></span>
                  </i>
                  Cancel
                </button>
                <span class="form-text text-muted fs-7 mt-2">
                  JPG, JPEG, PNG or WEBP. Max size 2 MB.
                </span>
                <span class="text-danger fs-7 mt-1" *ngIf="avatarError">
                  {{ avatarError }}
                </span>
              </div>
              <!--end::Actions-->
            </div>
          </div>
        </div>
        <div class="row mb-6">
          <label class="col-lg-4 col-form-label required fw-bold fs-6"
            >Full Name</label
          >
          <div class="col-lg-8">
            <div class="row">
              <div class="col-lg-6 fv-row">
                <input
                  type="text"
                  class="
                    form-control form-control-lg form-control-solid
                    mb-3 mb-lg-0
                  "
                  placeholder="First name"
                  formControlName="firstName"
                />
              </div>
              <div class="col-lg-6 fv-row">
                <input
                  type="text"
                  class="form-control form-control-lg form-control-solid"
                  placeholder="Last name"
                  formControlName="lastName"
                />
              </div>
            </div>
          </div>
        </div>
        <div class="row mb-6">
          <label class="col-lg-4 col-form-label fw-bold fs-6">Email</label>
          <div class="col-lg-8 fv-row">
            <input
              type="email"
              class="form-control form-control-lg form-control-solid"
              placeholder="Email"
              formControlName="email"
            />
          </div>
        </div>
        <div class="row mb-6">
          <label class="col-lg-4 col-form-label fw-bold fs-6"
            ><span class="required">Contact Phone</span></label
          >
          <div class="col-lg-8 fv-row">
            <input
              type="tel"
              class="form-control form-control-lg form-control-solid"
              placeholder="Phone number"
              formControlName="phoneNumber"
            />
          </div>
        </div>
        <div class="row mb-6">
          <label class="col-lg-4 col-form-label fw-bold fs-6">Address</label>
          <div class="col-lg-8 fv-row">
            <input
              type="text"
              class="form-control form-control-lg form-control-solid"
              placeholder="Address"
              formControlName="address"
            />
          </div>
        </div>
      </div>
      <div class="card-footer d-flex justify-content-end py-6 px-9">
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="isLoading"
          (click)="saveSettings()"
        >
          <ng-container *ngIf="!isLoading">Save Changes</ng-container>
          <ng-container *ngIf="isLoading">
            <span clas="indicator-progress" [style.display]="'block'">
              Please wait...{{ " " }}
              <span
                class="spinner-border spinner-border-sm align-middle ms-2"
              ></span>
            </span>
          </ng-container>
        </button>
      </div>
    </form>
  </div>
</div>
