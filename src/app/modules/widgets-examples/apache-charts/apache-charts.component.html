<section class="apache-charts-page">
  <div class="card mb-7">
    <div class="card-body d-flex flex-column flex-lg-row align-items-lg-end gap-5">
      <div class="flex-grow-1">
        <h1 class="fs-2 fw-bold mb-2">Apache Charts</h1>
        <p class="text-muted mb-0">
          Browse {{ demos.length }} bundled Apache ECharts examples. Charts initialize lazily as you scroll.
        </p>
      </div>

      <label class="apache-charts-filter">
        <span class="form-label">Search examples</span>
        <input
          type="search"
          class="form-control"
          placeholder="Title, ID, or category"
          [(ngModel)]="searchTerm"
        />
      </label>

      <label class="apache-charts-filter">
        <span class="form-label">Category</span>
        <select class="form-select" [(ngModel)]="selectedCategory">
          <option value="">All categories</option>
          <option *ngFor="let category of categories" [value]="category">
            {{ category }}
          </option>
        </select>
      </label>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-between mb-5">
    <span class="text-muted">Showing {{ visibleDemos.length }} examples</span>
    <button
      *ngIf="searchTerm || selectedCategory"
      type="button"
      class="btn btn-sm btn-light"
      (click)="searchTerm = ''; selectedCategory = ''"
    >
      Clear filters
    </button>
  </div>

  <div *ngIf="visibleDemos.length; else noResults" class="row g-7">
    <div
      *ngFor="let demo of visibleDemos; trackBy: trackByDemoId"
      class="col-12 col-xxl-6"
    >
      <app-apache-widget-viewport [demo]="demo"></app-apache-widget-viewport>
    </div>
  </div>

  <ng-template #noResults>
    <div class="card">
      <div class="card-body py-15 text-center text-muted">
        No Apache ECharts examples match the current filters.
      </div>
    </div>
  </ng-template>
</section>
