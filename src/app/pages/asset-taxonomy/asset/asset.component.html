<!--begin::Table-->
<div class="card card-flush mt-6 mt-xl-9">
  <!--begin::Card header-->
  <div class="card-header mt-5">
    <!--begin::Card title-->
    <div class="card-title flex-column">
      <h3 class="fw-bold mb-1">Asset</h3>
    </div>
    <!--begin::Card title-->
    <!--begin::Card toolbar-->
    <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
        <input type="text" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Asset" #tableSearch (input)="table.search(tableSearch.value)" aria-label="Search Asset" />
      </div>
      <!--end::Search-->
      <!--begin::Employer filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
          <option [ngValue]="null">All Employers</option>
          <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
        </select>
      </div>
      <!--end::Employer filter-->
      <!--begin::System filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by system" [ngModel]="systemFilter" (ngModelChange)="filterBySystem($event)">
          <option [ngValue]="null">All Systems</option>
          <option *ngFor="let s of systemOptions" [ngValue]="s.id">{{ s.label }}</option>
        </select>
      </div>
      <!--end::System filter-->
      <!--begin::Button-->
      <button type="button" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddModal(assetModal)">Add Asset</button>
      <!--end::Button-->
    </div>
    <!--begin::Card toolbar-->
  </div>
  <!--end::Card header-->
  <!--begin::Card body-->
  <div class="card-body pt-0">
    <!--begin::Table container-->
    <app-data-table
      [table]="table"
      tableId="kt_profile_overview_table"
      (editRecord)="openEditModal(assetModal, $event)"
      (deleteRecord)="table.confirmDelete($event, $event.name)">
    </app-data-table>
    <!--end::Table container-->
  </div>
  <!--end::Card body-->
</div>
<!--end::Card-->

<!--begin::Modal - Asset (Add / Edit)-->
<ng-template #assetModal let-modal>
  <app-form-modal
    #formModal
    [title]="assetForm.id ? 'Edit Asset' : 'Add Asset'"
    [formId]="assetForm.id ? 'kt_modal_edit_asset_form' : 'kt_modal_add_asset_form'"
    [submitLabel]="assetForm.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submit(assetNgForm, modal)" #assetNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_asset'">
          <span class="required">Asset Name</span>
        </label>
        <!--end::Label-->
        <input
          [id]="formModal.formId + '_asset'"
          type="text"
          class="form-control form-control-solid"
          placeholder="Enter Asset Name"
          name="asset"
          [(ngModel)]="assetForm.name"
          required
          #assetControl="ngModel"
          [class.is-invalid]="assetControl.invalid && (assetControl.touched || assetNgForm.submitted)"
          [attr.aria-invalid]="(assetControl.invalid && (assetControl.touched || assetNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(assetControl.invalid && (assetControl.touched || assetNgForm.submitted)) ? (formModal.formId + '_asset_error') : null"
          appTrimmedRequired />
        <div *ngIf="assetControl.invalid && (assetControl.touched || assetNgForm.submitted)" [id]="formModal.formId + '_asset_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter asset name.</div>
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_tag'">Tag</label>
        <input [id]="formModal.formId + '_tag'" type="text" class="form-control form-control-solid" placeholder="Enter Tag Name" name="tag" [(ngModel)]="assetForm.tag" />
      </div>
      <div class="d-flex flex-column mb-15 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_system'">
          <span class="required">System Name</span>
        </label>
        <!--end::Label-->
        <select
          [id]="formModal.formId + '_system'"
          class="form-select form-select-solid"
          data-control="select2"
          data-placeholder="Select a System"
          name="system"
          [(ngModel)]="assetForm.systemId"
          required
          aria-label="System Name"
          #systemControl="ngModel"
          [class.is-invalid]="systemControl.invalid && (systemControl.touched || assetNgForm.submitted)"
          [attr.aria-invalid]="(systemControl.invalid && (systemControl.touched || assetNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(systemControl.invalid && (systemControl.touched || assetNgForm.submitted)) ? (formModal.formId + '_system_error') : null">
          <option [ngValue]="null">Select system...</option>
          <option *ngFor="let s of systemOptions" [ngValue]="s.id">{{ s.label }}</option>
        </select>
        <div *ngIf="systemControl.invalid && (systemControl.touched || assetNgForm.submitted)" [id]="formModal.formId + '_system_error'" class="fv-plugins-message-container invalid-feedback d-block">Select system name.</div>
      </div>
      <!--end::Input group-->
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Asset (Add / Edit)-->
