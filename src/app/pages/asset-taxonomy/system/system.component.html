<!--begin::Table-->
<div class="card card-flush mt-6 mt-xl-9">
  <!--begin::Card header-->
  <div class="card-header mt-5">
    <!--begin::Card title-->
    <div class="card-title flex-column">
      <h3 class="fw-bold mb-1">System</h3>
    </div>
    <!--begin::Card title-->
    <!--begin::Card toolbar-->
    <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
        <input type="text" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search System" #tableSearch (input)="table.search(tableSearch.value)" />
      </div>
      <!--end::Search-->
      <!--begin::Employer filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
          <option [ngValue]="null">All Employers</option>
          <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
        </select>
      </div>
      <!--end::Employer filter-->
      <!--begin::Unit filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by unit" [ngModel]="unitFilter" (ngModelChange)="filterByUnit($event)">
          <option [ngValue]="null">All Units</option>
          <option *ngFor="let u of unitOptions" [ngValue]="u.id">{{ u.label }}</option>
        </select>
      </div>
      <!--end::Unit filter-->
      <!--begin::Button-->
      <a href="javascript:;" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddModal(addSystemModal)">Add System</a>
      <!--end::Button-->
    </div>
    <!--begin::Card toolbar-->
  </div>
  <!--end::Card header-->
  <!--begin::Card body-->
  <div class="card-body pt-0">
    <!--begin::Table container-->
    <app-data-table
      [table]="table"
      tableId="kt_profile_overview_table"
      (editRecord)="openEditModal(editSystemModal, $event)"
      (deleteRecord)="table.confirmDelete($event, $event.system)">
    </app-data-table>
    <!--end::Table container-->
  </div>
  <!--end::Card body-->
</div>
<!--end::Card-->

<!--begin::Modal - Add System-->
<ng-template #addSystemModal let-modal>
  <ng-container *ngTemplateOutlet="systemFormTpl; context: { modal: modal, title: 'Add System', formId: 'kt_modal_add_system_form', submitLabel: 'Submit' }"></ng-container>
</ng-template>
<!--end::Modal - Add System-->
<!--begin::Modal - Edit System-->
<ng-template #editSystemModal let-modal>
  <ng-container *ngTemplateOutlet="systemFormTpl; context: { modal: modal, title: 'Edit System', formId: 'kt_modal_edit_system_form', submitLabel: 'Save' }"></ng-container>
</ng-template>
<!--end::Modal - Edit System-->
<ng-template #systemFormTpl let-modal="modal" let-title="title" let-formId="formId" let-submitLabel="submitLabel">
  <!--begin::Modal header-->
  <div class="modal-header pb-0 border-0 justify-content-end">
    <!--begin::Close-->
    <div class="btn btn-sm btn-icon btn-active-color-primary" (click)="modal.dismiss('Cross click')">
      <app-keenicon name="cross" class="fs-1"></app-keenicon>
    </div>
    <!--end::Close-->
  </div>
  <!--begin::Modal header-->
  <!--begin::Modal body-->
  <div class="modal-body scroll-y px-5 px-md-10 px-lg-15 pt-0 pb-10 pb-md-15">
    <!--begin:Form-->
    <form [id]="formId" class="form" (ngSubmit)="submit(systemNgForm, modal)" #systemNgForm="ngForm" novalidate>
      <!--begin::Heading-->
      <div class="mb-8 mb-md-13 text-center">
        <!--begin::Title-->
        <h1 class="mb-3">{{ title }}</h1>
        <!--end::Title-->
      </div>
      <!--end::Heading-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2">
          <span class="required">System Name</span>
        </label>
        <!--end::Label-->
        <input type="text" class="form-control form-control-solid" placeholder="Enter System Name" name="system" [(ngModel)]="systemForm.system" required />
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-15 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2">
          <span class="required">Unit Name</span>
        </label>
        <!--end::Label-->
        <select class="form-select form-select-solid" data-control="select2" data-placeholder="Select a Unit" name="unit" [(ngModel)]="systemForm.unitId" required>
          <option [ngValue]="null">Select unit...</option>
          <option *ngFor="let u of unitOptions" [ngValue]="u.id">{{ u.label }}</option>
        </select>
      </div>
      <!--end::Input group-->
      <!--begin::Actions-->
      <div class="text-center">
        <button type="reset" class="btn btn-light me-3" (click)="modal.dismiss('cancel')">Cancel</button>
        <button type="submit" class="btn btn-primary" [attr.data-kt-indicator]="saving ? 'on' : 'off'">
          <span class="indicator-label">{{ submitLabel }}</span>
          <span class="indicator-progress">Please wait...
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
        </button>
      </div>
      <!--end::Actions-->
    </form>
    <!--end:Form-->
  </div>
  <!--end::Modal body-->
</ng-template>
