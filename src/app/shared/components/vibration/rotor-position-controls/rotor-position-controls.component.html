<app-analysis-controls [tab]="tab" dateSelectionTitle="Event date and time"
  [dateSelectionContent]="acquisition" [controlsContent]="settingsContent"></app-analysis-controls>
<ng-template #acquisition>
  @if (session.error) {
    <div class="alert alert-warning mb-0" role="alert">{{ session.error }}</div>
  } @else {
    <app-rotor-position-event-picker [inputId]="tab.id" [pairs]="session.pairs" [value]="session.event()"
      (selected)="session.event.set($event)"></app-rotor-position-event-picker>
  }
</ng-template>
<ng-template #settingsContent>
  @if (!session.error) {
    <div class="row g-5 mt-0">
      <div class="col-12 col-sm-6 col-lg-3">
        <label class="form-label" [for]="tab.id + '_rotor_quantity'">Quantity</label>
        <input class="form-control form-control-solid" [id]="tab.id + '_rotor_quantity'" value="Displacement (DC)" readonly>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <label class="form-label" [for]="tab.id + '_rotor_unit'">Unit</label>
        <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
          [id]="tab.id + '_rotor_unit'" [ngModel]="settings.unit" (ngModelChange)="update('unit', $event)">
          @for (unit of units; track unit) { <option [value]="unit">{{ unit }}</option> }
        </select>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <label class="form-label" [for]="tab.id + '_rotor_reference'">Position reference</label>
        <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
          [id]="tab.id + '_rotor_reference'" [ngModel]="settings.reference" (ngModelChange)="update('reference', $event)">
          <option value="bearing">Bearing centre</option><option value="first">First valid point</option>
        </select>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <label class="form-label" [for]="tab.id + '_rotor_axis'">Trend X axis</label>
        <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
          [id]="tab.id + '_rotor_axis'" [ngModel]="settings.trendAxis" (ngModelChange)="update('trendAxis', $event)">
          <option value="time">Time</option><option value="rpm">RPM</option>
        </select>
      </div>
    </div>
  }
</ng-template>
