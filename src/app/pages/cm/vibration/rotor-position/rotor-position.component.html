<app-analysis-workspace [state]="state" [headerContent]="header">
  <ng-template let-tab>
    @if (sessions.forTab(tab); as session) {
      @if (!session.error) {
        @if (session.event(); as event) {
          <div class="row g-7">
            @for (pair of session.pairs; track pair.key) {
              <section class="col-12 mw-100"
                [attr.aria-labelledby]="tab.id + '_rotor_' + pair.key">
                @if (!$first) { <div class="separator mb-7"></div> }
                <app-vibration-rotor-position-chart [pair]="pair" [event]="event" [settings]="session.settings()"
                  (sourceUnit)="session.setSourceUnit(pair.key, $event)"
                  [titleId]="tab.id + '_rotor_' + pair.key"></app-vibration-rotor-position-chart>
              </section>
            }
          </div>
        } @else {
          <div class="text-gray-500 text-center py-10" role="status">Select a Startup, Coast down or Trip event above to view shaft position.</div>
        }
      }
    }
  </ng-template>
</app-analysis-workspace>
<ng-template #header let-tab>
  <app-rotor-position-controls [tab]="tab"></app-rotor-position-controls>
</ng-template>
