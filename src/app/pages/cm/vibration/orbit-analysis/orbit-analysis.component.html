<app-analysis-workspace [state]="state" [controlsContent]="orbitControls" [dateSelectionContent]="orbitDate"
  dateSelectionTitle="Acquisition date and time">
  <ng-template let-tab>
    @if (!tab.orbitCapture) {
      <div class="text-gray-500 text-center py-10" role="status">Select an acquisition period and event time above to load one second of measurement data.</div>
    } @else {
      @for (pair of tab.orbitPairs; track pair.key) {
        <section [attr.aria-labelledby]="tab.id + pair.key">
          @if (!$first) { <div class="separator my-7"></div> }
          <app-vibration-orbit-chart [pair]="pair" [titleId]="tab.id + pair.key" [settings]="tab.orbitSettings || defaults"
            [selection]="tab.orbitCapture"></app-vibration-orbit-chart>
        </section>
      }
    }
  </ng-template>
</app-analysis-workspace>
<ng-template #orbitDate let-tab>
  <app-orbit-acquisition-picker [inputId]="tab.id" [pairs]="tab.orbitPairs" [period]="tab.orbitPeriod || 'Daily'" [value]="tab.orbitCapture"
    (periodChange)="state.updateOrbitPeriod(tab.id, $event)" (selected)="state.selectOrbitCapture(tab.id, $event)"></app-orbit-acquisition-picker>
</ng-template>
<ng-template #orbitControls let-tab>
  <app-orbit-analysis-controls [inputId]="tab.id" [settings]="tab.orbitSettings || defaults"
    (settingsChange)="state.updateOrbitSettings(tab.id, $event)"></app-orbit-analysis-controls>
</ng-template>
