<!--begin::Row-->
<div class="row gx-5 gx-xl-10">
  <!--begin::Col-->
  <div class="col-xl-8 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Plant</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Plant" #plantsSearch (input)="plants.search(plantsSearch.value)" />
          </div>
          <!--end::Search-->
          <!--begin::Employer filter-->
          <div class="my-1 me-md-4 w-100 w-md-250px">
            <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
              <option [ngValue]="null">All Employers</option>
              <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
            </select>
          </div>
          <!--end::Employer filter-->
          <!--begin::Button-->
          <a href="javascript:;" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddPlantModal(addPlantModal)">Add Plant</a>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <!--begin::Table container-->
        <app-data-table
          [table]="plants"
          tableId="kt_profile_overview_table"
          (editRecord)="openEditPlantModal(editPlantModal, $event)"
          (deleteRecord)="deletePlant($event)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <!--end::Col-->
  <!--begin::Col-->
  <div class="col-xl-4 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Type</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" id="kt_filter_search_type" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Type" #typesSearch (input)="types.search(typesSearch.value)" />
          </div>
          <!--end::Search-->
          <!--begin::Button-->
          <a href="javascript:;" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddTypeModal(addTypeModal)">Add Type</a>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <!--begin::Table container-->
        <app-data-table
          [table]="types"
          tableId="kt_plant_type_table"
          (editRecord)="openEditTypeModal(editTypeModal, $event)"
          (deleteRecord)="deleteType($event)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <!--end::Col-->
</div>
<!--end::Row-->

<!--begin::Modal - Add Plant-->
<ng-template #addPlantModal let-modal>
  <ng-container *ngTemplateOutlet="plantForm; context: { modal: modal, title: 'Add Plant', formId: 'kt_modal_add_plant_form', submitLabel: 'Submit' }"></ng-container>
</ng-template>
<!--end::Modal - Add Plant-->

<!--begin::Modal - Edit Plant-->
<ng-template #editPlantModal let-modal>
  <ng-container *ngTemplateOutlet="plantForm; context: { modal: modal, title: 'Edit Plant', formId: 'kt_modal_edit_plant_form', submitLabel: 'Save' }"></ng-container>
</ng-template>
<!--end::Modal - Edit Plant-->

<!--begin::Modal - Add Type-->
<ng-template #addTypeModal let-modal>
  <ng-container *ngTemplateOutlet="typeForm; context: { modal: modal, title: 'Add Type', formId: 'kt_modal_add_type_form', submitLabel: 'Submit' }"></ng-container>
</ng-template>
<!--end::Modal - Add Type-->

<!--begin::Modal - Edit Type-->
<ng-template #editTypeModal let-modal>
  <ng-container *ngTemplateOutlet="typeForm; context: { modal: modal, title: 'Edit Type', formId: 'kt_modal_edit_type_form', submitLabel: 'Save' }"></ng-container>
</ng-template>
<!--end::Modal - Edit Type-->

<!-- Shared plant form (Add / Edit differ only in title, form id and submit label) -->
<ng-template #plantForm let-modal="modal" let-title="title" let-formId="formId" let-submitLabel="submitLabel">
  <!--begin::Modal header-->
  <div class="modal-header pb-0 border-0 justify-content-end">
    <!--begin::Close-->
    <div class="btn btn-sm btn-icon btn-active-color-primary" (click)="modal.dismiss('Cross click')">
      <app-keenicon name="cross" class="fs-1"></app-keenicon>
    </div>
    <!--end::Close-->
  </div>
  <!--begin::Modal header-->
  <!--begin::Modal body-->
  <div class="modal-body scroll-y px-5 px-md-10 px-lg-15 pt-0 pb-10 pb-md-15">
    <!--begin:Form-->
    <form [id]="formId" class="form" (ngSubmit)="submitPlant(plantNgForm, modal)" #plantNgForm="ngForm" novalidate>
      <!--begin::Heading-->
      <div class="mb-8 mb-md-13 text-center">
        <!--begin::Title-->
        <h1 class="mb-3">{{ title }}</h1>
        <!--end::Title-->
      </div>
      <!--end::Heading-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2">
          <span class="required">Name</span>
        </label>
        <!--end::Label-->
        <input type="text" class="form-control form-control-solid" placeholder="Enter Plant Name" name="name" [(ngModel)]="plantFormModel.name" required />
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="row g-5 g-md-9 mb-8">
        <!--begin::Col-->
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formId + '_type'">Type</label>
          <select [id]="formId + '_type'" aria-label="Type" class="form-select form-select-solid" data-control="select2" data-hide-search="true" data-placeholder="Select a Type" name="plantTypeId" [(ngModel)]="plantFormModel.plantTypeId" required>
            <option [ngValue]="null" disabled>Select type...</option>
            <option *ngFor="let t of typeOptions" [ngValue]="t.id">{{ t.name }}</option>
          </select>
        </div>
        <!--end::Col-->
        <!--begin::Col-->
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formId + '_site'">Site</label>
          <select [id]="formId + '_site'" aria-label="Site" class="form-select form-select-solid" data-control="select2" data-placeholder="Select a Site" name="siteId" [(ngModel)]="plantFormModel.siteId" required>
            <option [ngValue]="null" disabled>Select site...</option>
            <option *ngFor="let s of siteOptions" [ngValue]="s.id">{{ s.label }}</option>
          </select>
        </div>
        <!--end::Col-->
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-15 fv-row">
        <label class="fs-6 fw-semibold mb-2" [for]="formId + '_employer'">Assign Employer</label>
        <select [id]="formId + '_employer'" aria-label="Assign Employer" class="form-select form-select-solid" data-control="select2" data-placeholder="Select an Employer" name="employer" [(ngModel)]="plantFormModel.employerId">
          <option [ngValue]="null">No Employer</option>
          <option *ngFor="let u of employerUsers" [ngValue]="u.id">{{ u.name }}</option>
        </select>
      </div>
      <!--end::Input group-->
      <!--begin::Actions-->
      <div class="text-center">
        <button type="reset" class="btn btn-light me-3" (click)="modal.dismiss('cancel')">Cancel</button>
        <button type="submit" class="btn btn-primary" [attr.data-kt-indicator]="saving ? 'on' : 'off'">
          <span class="indicator-label">{{ submitLabel }}</span>
          <span class="indicator-progress">Please wait...
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span></span>
        </button>
      </div>
      <!--end::Actions-->
    </form>
    <!--end:Form-->
  </div>
  <!--end::Modal body-->
</ng-template>
