<!--begin::Table-->
<div class="card card-flush mt-6 mt-xl-9">
  <!--begin::Card header-->
  <div class="card-header mt-5">
    <!--begin::Card title-->
    <div class="card-title flex-column">
      <h3 class="fw-bold mb-1">Unit</h3>
    </div>
    <!--begin::Card title-->
    <!--begin::Card toolbar-->
    <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
        <input type="text" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Unit" #tableSearch (input)="table.search(tableSearch.value)" aria-label="Search Unit" />
      </div>
      <!--end::Search-->
      <!--begin::Employer filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
          <option [ngValue]="null">All Employers</option>
          <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
        </select>
      </div>
      <!--end::Employer filter-->
      <!--begin::Plant filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by plant" [ngModel]="plantFilter" (ngModelChange)="filterByPlant($event)">
          <option [ngValue]="null">All Plants</option>
          <option *ngFor="let p of plantOptions" [ngValue]="p.id">{{ p.label }}</option>
        </select>
      </div>
      <!--end::Plant filter-->
      <!--begin::Button-->
      <button type="button" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddModal(unitModal)">Add Unit</button>
      <!--end::Button-->
    </div>
    <!--begin::Card toolbar-->
  </div>
  <!--end::Card header-->
  <!--begin::Card body-->
  <div class="card-body pt-0">
    <!--begin::Table container-->
    <app-data-table
      [table]="table"
      tableId="kt_profile_overview_table"
      (editRecord)="openEditModal(unitModal, $event)"
      (deleteRecord)="table.confirmDelete($event, $event.name)">
    </app-data-table>
    <!--end::Table container-->
  </div>
  <!--end::Card body-->
</div>
<!--end::Card-->

<!--begin::Modal - Unit (Add / Edit)-->
<ng-template #unitModal let-modal>
  <app-form-modal
    #formModal
    [title]="unitForm.id ? 'Edit Unit' : 'Add Unit'"
    [formId]="unitForm.id ? 'kt_modal_edit_unit_form' : 'kt_modal_add_unit_form'"
    [submitLabel]="unitForm.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submit(unitNgForm, modal)" #unitNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_unit'">
          <span class="required">Unit Name</span>
        </label>
        <!--end::Label-->
        <input
          [id]="formModal.formId + '_unit'"
          type="text"
          class="form-control form-control-solid"
          placeholder="Enter Unit Name"
          name="unit"
          [(ngModel)]="unitForm.name"
          required
          #unitControl="ngModel"
          [class.is-invalid]="unitControl.invalid && (unitControl.touched || unitNgForm.submitted)"
          [attr.aria-invalid]="(unitControl.invalid && (unitControl.touched || unitNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(unitControl.invalid && (unitControl.touched || unitNgForm.submitted)) ? (formModal.formId + '_unit_error') : null"
          appTrimmedRequired />
        <div *ngIf="unitControl.invalid && (unitControl.touched || unitNgForm.submitted)" [id]="formModal.formId + '_unit_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter unit name.</div>
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-15 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_plant'">
          <span class="required">Plant Name</span>
        </label>
        <!--end::Label-->
        <select
          [id]="formModal.formId + '_plant'"
          class="form-select form-select-solid"
          data-control="select2"
          data-placeholder="Select a Plant"
          name="plant"
          [(ngModel)]="unitForm.plantId"
          required
          aria-label="Plant Name"
          #plantControl="ngModel"
          [class.is-invalid]="plantControl.invalid && (plantControl.touched || unitNgForm.submitted)"
          [attr.aria-invalid]="(plantControl.invalid && (plantControl.touched || unitNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(plantControl.invalid && (plantControl.touched || unitNgForm.submitted)) ? (formModal.formId + '_plant_error') : null">
          <option [ngValue]="null">Select plant...</option>
          <option *ngFor="let p of plantOptions" [ngValue]="p.id">{{ p.label }}</option>
        </select>
        <div *ngIf="plantControl.invalid && (plantControl.touched || unitNgForm.submitted)" [id]="formModal.formId + '_plant_error'" class="fv-plugins-message-container invalid-feedback d-block">Select plant name.</div>
      </div>
      <!--end::Input group-->
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Unit (Add / Edit)-->
