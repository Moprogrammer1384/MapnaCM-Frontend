<app-analysis-workspace [state]="state" domain="frequency"
  [measurementChartContent]="frequencyChart" [isMeasurementChartReady]="chartReady"
  [headerContent]="header"
  awaitingSelectionMessage="Select an event time above to display its spectrum."></app-analysis-workspace>
<ng-template #frequencyChart let-item let-tab="tab">
  @if (tab.timeDomainEvent; as event) {
    <app-vibration-frequency-domain-chart [measurementId]="item.measurement.id" [settings]="tab.chartSettings"
      [measurementIds]="tab.selection.measurementIds" [sourceKey]="event.id" [from]="event.from" [to]="event.to"
      (sourceProfile)="state.updateSourceProfile(tab.id, item.measurement.id, $event)"
      (sourceSettings)="initializeSettings(tab.id, $event)"></app-vibration-frequency-domain-chart>
  }
</ng-template>

<ng-template #header let-tab>
  <app-frequency-domain-controls [tab]="tab"></app-frequency-domain-controls>
</ng-template>
