<!--begin::Row-->
<div class="row gx-5 gx-xl-10">
  <div class="col-12 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Measurement</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Measurement" #tableSearch (input)="table.search(tableSearch.value)" aria-label="Search Measurement" />
          </div>
          <!--end::Search-->
          <!--begin::Employer filter-->
          <div class="my-1 me-md-4 w-100 w-md-250px">
            <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
              <option [ngValue]="null">All Employers</option>
              <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
            </select>
          </div>
          <!--end::Employer filter-->
          <!--begin::Component filter-->
          <div class="my-1 me-md-4 w-100 w-md-250px">
            <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by component" [ngModel]="componentFilter" (ngModelChange)="filterByComponent($event)">
              <option [ngValue]="null">All Components</option>
              <option *ngFor="let s of componentOptions" [ngValue]="s.id">{{ s.label }}</option>
            </select>
          </div>
          <!--end::Component filter-->
          <div class="my-1 me-md-4 w-100 w-md-150px">
            <select class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by measurement type" [ngModel]="typeFilter" (ngModelChange)="filterByType($event)">
              <option [ngValue]="null">All Types</option>
              <option *ngFor="let type of typeOptions" [ngValue]="type.id">{{ type.name }} ({{ type.unit }})</option>
            </select>
          </div>
          <!--begin::Button-->
          <button type="button" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddModal(measurementModal)">Add Measurement</button>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <!--begin::Table container-->
        <app-data-table
          [table]="table"
          tableId="kt_measurement_table"
          (editRecord)="openEditModal(measurementModal, $event)"
          (deleteRecord)="table.confirmDelete($event, $event.name)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <div class="col-12 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Measurement Type</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" id="kt_measurement_type_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Type" aria-label="Search measurement types" #typesSearch (input)="types.search(typesSearch.value)" />
          </div>
          <!--end::Search-->
          <!--begin::Button-->
          <button type="button" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddTypeModal(typeModal)">Add Type</button>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <!--begin::Table container-->
        <app-data-table
          [table]="types"
          tableId="kt_measurement_type_table"
          (editRecord)="openEditTypeModal(typeModal, $event)"
          (deleteRecord)="deleteType($event)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <!--end::Col-->
</div>
<!--end::Row-->

<!--begin::Modal - Measurement (Add / Edit)-->
<ng-template #measurementModal let-modal>
  <app-form-modal
    #formModal
    [title]="measurementForm.id ? 'Edit Measurement' : 'Add Measurement'"
    [formId]="measurementForm.id ? 'kt_modal_edit_measurement_form' : 'kt_modal_add_measurement_form'"
    [submitLabel]="measurementForm.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submit(measurementNgForm, modal)" #measurementNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_measurement'">
          <span class="required">Measurement Name</span>
        </label>
        <!--end::Label-->
        <input
          [id]="formModal.formId + '_measurement'"
          type="text"
          class="form-control form-control-solid"
          placeholder="Enter Measurement Name"
          name="measurement"
          [(ngModel)]="measurementForm.name"
          required
          #measurementControl="ngModel"
          [class.is-invalid]="measurementControl.invalid && (measurementControl.touched || measurementNgForm.submitted)"
          [attr.aria-invalid]="(measurementControl.invalid && (measurementControl.touched || measurementNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(measurementControl.invalid && (measurementControl.touched || measurementNgForm.submitted)) ? (formModal.formId + '_measurement_error') : null"
          appTrimmedRequired />
        <div *ngIf="measurementControl.invalid && (measurementControl.touched || measurementNgForm.submitted)" [id]="formModal.formId + '_measurement_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter measurement name.</div>
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_tag'">Tag</label>
        <input [id]="formModal.formId + '_tag'" type="text" class="form-control form-control-solid" placeholder="Enter Tag Name" name="tag" [(ngModel)]="measurementForm.tag" />
      </div>
      <div class="row g-5 g-md-9 mb-8">
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formModal.formId + '_measurementTypeId'">Type</label>
          <select
            [id]="formModal.formId + '_measurementTypeId'"
            class="form-select form-select-solid"
            data-control="select2"
            data-placeholder="Select a Type"
            name="measurementTypeId"
            [(ngModel)]="measurementForm.measurementTypeId"
            #measurementType="ngModel"
            required
            aria-label="Type"
            [class.is-invalid]="measurementType.invalid && (measurementType.touched || measurementNgForm.submitted)"
            [attr.aria-invalid]="(measurementType.invalid && (measurementType.touched || measurementNgForm.submitted)) ? 'true' : null"
            [attr.aria-describedby]="(measurementType.invalid && (measurementType.touched || measurementNgForm.submitted)) ? (formModal.formId + '_measurementTypeId_error') : null">
            <option [ngValue]="null">Select type...</option>
            <option *ngFor="let type of typeOptions" [ngValue]="type.id">{{ type.name }} ({{ type.unit }})</option>
          </select>
          <div *ngIf="measurementType.invalid && (measurementType.touched || measurementNgForm.submitted)" [id]="formModal.formId + '_measurementTypeId_error'" class="fv-plugins-message-container invalid-feedback d-block">Select type.</div>
          <div *ngIf="typeOptions.length === 0" class="form-text">Add a Measurement Type with its name and unit first.</div>        </div>
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formModal.formId + '_sensitivity'">Sensitivity</label>
          <input
            [id]="formModal.formId + '_sensitivity'"
            type="number"
            step="any"
            class="form-control form-control-solid"
            placeholder="Enter Sensitivity"
            name="sensitivity"
            [(ngModel)]="measurementForm.sensitivity"
            #sensitivity="ngModel"
            required
            [class.is-invalid]="sensitivity.invalid && (sensitivity.touched || measurementNgForm.submitted)"
            [attr.aria-invalid]="(sensitivity.invalid && (sensitivity.touched || measurementNgForm.submitted)) ? 'true' : null"
            [attr.aria-describedby]="(sensitivity.invalid && (sensitivity.touched || measurementNgForm.submitted)) ? (formModal.formId + '_sensitivity_error') : null"
            appFiniteNumber />
          <div *ngIf="sensitivity.invalid && (sensitivity.touched || measurementNgForm.submitted)" [id]="formModal.formId + '_sensitivity_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter a valid number for sensitivity.</div>        </div>
      </div>
      <div *ngIf="selectedTypeUnit" class="d-flex flex-column mb-8 fv-row">
        <label class="fs-6 fw-semibold mb-2" [for]="formModal.formId + '_unit'">Unit</label>
        <input [id]="formModal.formId + '_unit'" type="text" class="form-control form-control-solid" [value]="selectedTypeUnit" readonly />
      </div>
      <div class="d-flex flex-column mb-15 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_component'">
          <span class="required">Component Name</span>
        </label>
        <!--end::Label-->
        <select
          [id]="formModal.formId + '_component'"
          class="form-select form-select-solid"
          data-control="select2"
          data-placeholder="Select a Component"
          name="component"
          [(ngModel)]="measurementForm.componentId"
          required
          aria-label="Component Name"
          #componentControl="ngModel"
          [class.is-invalid]="componentControl.invalid && (componentControl.touched || measurementNgForm.submitted)"
          [attr.aria-invalid]="(componentControl.invalid && (componentControl.touched || measurementNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(componentControl.invalid && (componentControl.touched || measurementNgForm.submitted)) ? (formModal.formId + '_component_error') : null">
          <option [ngValue]="null">Select component...</option>
          <option *ngFor="let s of componentOptions" [ngValue]="s.id">{{ s.label }}</option>
        </select>
        <div *ngIf="componentControl.invalid && (componentControl.touched || measurementNgForm.submitted)" [id]="formModal.formId + '_component_error'" class="fv-plugins-message-container invalid-feedback d-block">Select component name.</div>
      </div>
      <!--end::Input group-->
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Measurement (Add / Edit)-->

<!--begin::Modal - Measurement Type (Add / Edit)-->

  <app-form-modal

    [title]="typeFormModel.id ? 'Edit Measurement Type' : 'Add Measurement Type'"
    [formId]="typeFormModel.id ? 'kt_modal_edit_measurement_type_form' : 'kt_modal_add_measurement_type_form'"
    [submitLabel]="typeFormModel.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submitType(typeNgForm, modal)" #typeNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_name'">
          <span class="required">Name</span>
        </label>
        <!--end::Label-->
        <input
          [id]="formModal.formId + '_name'"
          type="text"
          class="form-control form-control-solid"
          placeholder="Enter Type Name"
          name="name"
          [(ngModel)]="typeFormModel.name"
          required
          #nameControl="ngModel"
          [class.is-invalid]="nameControl.invalid && (nameControl.touched || typeNgForm.submitted)"
          [attr.aria-invalid]="(nameControl.invalid && (nameControl.touched || typeNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(nameControl.invalid && (nameControl.touched || typeNgForm.submitted)) ? (formModal.formId + '_name_error') : null"
          appTrimmedRequired />
        <div *ngIf="nameControl.invalid && (nameControl.touched || typeNgForm.submitted)" [id]="formModal.formId + '_name_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter name.</div>

          [attr.aria-describedby]="(unitControl.invalid && (unitControl.touched || typeNgForm.submitted)) ? (formModal.formId + '_unit_error') : null"
          appTrimmedRequired />
        <div *ngIf="unitControl.invalid && (unitControl.touched || typeNgForm.submitted)" [id]="formModal.formId + '_unit_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter unit.</div>
      </div>
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Measurement Type (Add / Edit)-->
