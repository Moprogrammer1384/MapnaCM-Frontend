@if (headerContent) {
  <ng-container [ngTemplateOutlet]="headerContent" [ngTemplateOutletContext]="{ $implicit: tab }"></ng-container>
} @else {
  <app-analysis-controls [tab]="tab" [domain]="domain" [showXAxis]="showXAxis" [showAmplitude]="showAmplitude"
    [useAvailableDates]="useAvailableDates" [dateSelectionContent]="dateSelectionContent" [dateSelectionTitle]="dateSelectionTitle"
    [controlsContent]="controlsContent" [additionalControlsContent]="additionalControlsContent"
    (dateTimeRangeApply)="dateTimeRangeApply.emit($event)" (chartSettingsChange)="chartSettingsChange.emit($event)"
    (dateRangeChange)="dateRangeChange.emit($event)" (timeRangeChange)="timeRangeChange.emit($event)"></app-analysis-controls>
}
@if (chartContent) {
  <div class="separator"></div>
  <div class="p-5 p-md-7">
    <ng-container [ngTemplateOutlet]="chartContent" [ngTemplateOutletContext]="{ $implicit: tab }"></ng-container>
  </div>
}
