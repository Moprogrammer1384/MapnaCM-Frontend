<!--begin::Row-->
<div class="row gx-5 gx-xl-10">
  <!--begin::Col-->
  <div class="col-xl-8 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Plant</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" [disabled]="listState.loading()" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Plant" #plantsSearch (input)="plants.search(plantsSearch.value)" aria-label="Search Plant" />
          </div>
          <!--end::Search-->
          <!--begin::Employer filter-->
          <div class="my-1 me-md-4 w-100 w-md-250px">
            <select [disabled]="saving || !employersState.ready" class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
              <option [ngValue]="null">All Employers</option>
              <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
            </select>
          </div>
          <!--end::Employer filter-->
          <!--begin::Button-->
          <button type="button" [disabled]="!canAdd" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddPlantModal(plantModal)">Add Plant</button>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <app-request-feedback [state]="employersState" loadingMessage="Loading employers..." [retryDisabled]="saving" (retry)="loadEmployerUsers()"></app-request-feedback>
        <app-request-feedback [state]="sitesState" loadingMessage="Loading site options..." [retryDisabled]="saving" (retry)="loadSites()"></app-request-feedback>
        <app-request-feedback [state]="typesState" loadingMessage="Loading plant types..." [retryDisabled]="saving" (retry)="loadTypes()"></app-request-feedback>
        <div *ngIf="sitesState.ready && siteOptions.length === 0" class="alert alert-warning">Add a <a routerLink="/asset-taxonomy/site" class="alert-link">Site</a> before creating a Plant.</div>
        <div *ngIf="typesState.ready && typeOptions.length === 0" class="alert alert-warning">Add a Plant Type below before creating a Plant.</div>
        <!--begin::Table container-->
        <app-data-table
          [table]="plants"
          [loading]="listState.loading()"
          [error]="listState.error()"
          [actionsDisabled]="actionsDisabled"
          [retryDisabled]="saving"
          emptyMessage="No plants yet."
          (retry)="loadPlants()"
          tableId="kt_profile_overview_table"
          (editRecord)="openEditPlantModal(plantModal, $event)"
          (deleteRecord)="deletePlant($event)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <!--end::Col-->
  <!--begin::Col-->
  <div class="col-xl-4 mb-5 mb-xl-10">
    <!--begin::Table-->
    <div class="card card-flush mt-6 mt-xl-9">
      <!--begin::Card header-->
      <div class="card-header mt-5">
        <!--begin::Card title-->
        <div class="card-title flex-column">
          <h3 class="fw-bold mb-1">Type</h3>
        </div>
        <!--begin::Card title-->
        <!--begin::Card toolbar-->
        <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
          <!--begin::Search-->
          <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
            <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
            <input type="text" [disabled]="typesState.loading()" id="kt_filter_search_type" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Type" #typesSearch (input)="types.search(typesSearch.value)" aria-label="Search plant types" />
          </div>
          <!--end::Search-->
          <!--begin::Button-->
          <button type="button" [disabled]="saving || typesState.loading()" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddTypeModal(typeModal)">Add Type</button>
          <!--end::Button-->
        </div>
        <!--begin::Card toolbar-->
      </div>
      <!--end::Card header-->
      <!--begin::Card body-->
      <div class="card-body pt-0">
        <!--begin::Table container-->
        <app-data-table
          [table]="types"
          [loading]="typesState.loading()"
          [error]="typesState.error()"
          [actionsDisabled]="saving"
          [retryDisabled]="saving"
          emptyMessage="No plant types yet."
          (retry)="loadTypes()"
          tableId="kt_plant_type_table"
          (editRecord)="openEditTypeModal(typeModal, $event)"
          (deleteRecord)="deleteType($event)">
        </app-data-table>
        <!--end::Table container-->
      </div>
      <!--end::Card body-->
    </div>
    <!--end::Card-->
  </div>
  <!--end::Col-->
</div>
<!--end::Row-->

<!--begin::Modal - Plant (Add / Edit)-->
<ng-template #plantModal let-modal>
  <app-form-modal
    #formModal
    [title]="plantFormModel.id ? 'Edit Plant' : 'Add Plant'"
    [formId]="plantFormModel.id ? 'kt_modal_edit_plant_form' : 'kt_modal_add_plant_form'"
    [submitLabel]="plantFormModel.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submitPlant(plantNgForm, modal)" #plantNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_name'">
          <span class="required">Name</span>
        </label>
        <!--end::Label-->
        <input
          [id]="formModal.formId + '_name'"
          type="text"
          class="form-control form-control-solid"
          placeholder="Enter Plant Name"
          name="name"
          [(ngModel)]="plantFormModel.name"
          required
          #nameControl="ngModel"
          [class.is-invalid]="nameControl.invalid && (nameControl.touched || plantNgForm.submitted)"
          [attr.aria-invalid]="(nameControl.invalid && (nameControl.touched || plantNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(nameControl.invalid && (nameControl.touched || plantNgForm.submitted)) ? (formModal.formId + '_name_error') : null"
          appTrimmedRequired />
        <div *ngIf="nameControl.invalid && (nameControl.touched || plantNgForm.submitted)" [id]="formModal.formId + '_name_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter name.</div>
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="row g-5 g-md-9 mb-8">
        <!--begin::Col-->
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formModal.formId + '_plantTypeId'">Type</label>
          <select
            [id]="formModal.formId + '_plantTypeId'"
            aria-label="Type"
            class="form-select form-select-solid"
            data-control="select2"
            data-hide-search="true"
            data-placeholder="Select a Type"
            name="plantTypeId"
            [(ngModel)]="plantFormModel.plantTypeId"
            required
            #plantTypeIdControl="ngModel"
            [class.is-invalid]="plantTypeIdControl.invalid && (plantTypeIdControl.touched || plantNgForm.submitted)"
            [attr.aria-invalid]="(plantTypeIdControl.invalid && (plantTypeIdControl.touched || plantNgForm.submitted)) ? 'true' : null"
            [attr.aria-describedby]="(plantTypeIdControl.invalid && (plantTypeIdControl.touched || plantNgForm.submitted)) ? (formModal.formId + '_plantTypeId_error') : null">
            <option [ngValue]="null" disabled>Select type...</option>
            <option *ngFor="let t of typeOptions" [ngValue]="t.id">{{ t.name }}</option>
          </select>
          <div *ngIf="plantTypeIdControl.invalid && (plantTypeIdControl.touched || plantNgForm.submitted)" [id]="formModal.formId + '_plantTypeId_error'" class="fv-plugins-message-container invalid-feedback d-block">Select type.</div>
        </div>
        <!--end::Col-->
        <!--begin::Col-->
        <div class="col-md-6 fv-row">
          <label class="required fs-6 fw-semibold mb-2" [for]="formModal.formId + '_siteId'">Site</label>
          <select
            [id]="formModal.formId + '_siteId'"
            aria-label="Site"
            class="form-select form-select-solid"
            data-control="select2"
            data-placeholder="Select a Site"
            name="siteId"
            [(ngModel)]="plantFormModel.siteId"
            required
            #siteIdControl="ngModel"
            [class.is-invalid]="siteIdControl.invalid && (siteIdControl.touched || plantNgForm.submitted)"
            [attr.aria-invalid]="(siteIdControl.invalid && (siteIdControl.touched || plantNgForm.submitted)) ? 'true' : null"
            [attr.aria-describedby]="(siteIdControl.invalid && (siteIdControl.touched || plantNgForm.submitted)) ? (formModal.formId + '_siteId_error') : null">
            <option [ngValue]="null" disabled>Select site...</option>
            <option *ngFor="let s of siteOptions" [ngValue]="s.id">{{ s.label }}</option>
          </select>
          <div *ngIf="siteIdControl.invalid && (siteIdControl.touched || plantNgForm.submitted)" [id]="formModal.formId + '_siteId_error'" class="fv-plugins-message-container invalid-feedback d-block">Select site.</div>
        </div>
        <!--end::Col-->
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-15 fv-row">
        <label class="fs-6 fw-semibold mb-2" [for]="formModal.formId + '_employer'">Assign Employer</label>
        <select [id]="formModal.formId + '_employer'" aria-label="Assign Employer" class="form-select form-select-solid" data-control="select2" data-placeholder="Select an Employer" name="employer" [(ngModel)]="plantFormModel.employerId">
          <option [ngValue]="null">No Employer</option>
          <option *ngFor="let u of employers" [ngValue]="u.id">{{ u.name }}</option>
        </select>
      </div>
      <!--end::Input group-->
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Plant (Add / Edit)-->
