<!--begin::Table-->
<div class="card card-flush mt-6 mt-xl-9">
  <!--begin::Card header-->
  <div class="card-header mt-5">
    <!--begin::Card title-->
    <div class="card-title flex-column">
      <h3 class="fw-bold mb-1">Component</h3>
    </div>
    <!--begin::Card title-->
    <!--begin::Card toolbar-->
    <div class="card-toolbar my-1 w-100 w-md-auto gap-3 gap-md-0">
      <!--begin::Search-->
      <div class="d-flex align-items-center position-relative my-1 me-md-4 w-100 w-md-auto">
        <app-keenicon name="magnifier" class="fs-3 position-absolute ms-3"></app-keenicon>
        <input type="text" [disabled]="listState.loading()" id="kt_filter_search" class="form-control form-control-solid form-select-sm w-100 w-md-150px ps-9" placeholder="Search Component" #tableSearch (input)="table.search(tableSearch.value)" aria-label="Search Component" />
      </div>
      <!--end::Search-->
      <!--begin::Employer filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select [disabled]="saving || !employersState.ready" class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by employer" [ngModel]="employerFilter" (ngModelChange)="filterByEmployer($event)">
          <option [ngValue]="null">All Employers</option>
          <option *ngFor="let e of employers" [ngValue]="e.id">{{ e.name }}</option>
        </select>
      </div>
      <!--end::Employer filter-->
      <!--begin::Asset filter-->
      <div class="my-1 me-md-4 w-100 w-md-250px">
        <select [disabled]="saving || !listState.ready" class="form-select form-select-sm form-select-solid" data-control="select2" data-width="100%" aria-label="Filter by asset" [ngModel]="assetFilter" (ngModelChange)="filterByAsset($event)">
          <option [ngValue]="null">All Assets</option>
          <option *ngFor="let s of assetOptions" [ngValue]="s.id">{{ s.label }}</option>
        </select>
      </div>
      <!--end::Asset filter-->
      <!--begin::Button-->
      <button type="button" [disabled]="!canAdd" class="btn btn-sm fw-bold btn-primary my-1 w-100 w-md-auto" (click)="openAddModal(componentModal)">Add Component</button>
      <!--end::Button-->
    </div>
    <!--begin::Card toolbar-->
  </div>
  <!--end::Card header-->
  <!--begin::Card body-->
  <div class="card-body pt-0">
    <app-request-feedback [state]="employersState" loadingMessage="Loading employers..." [retryDisabled]="saving" (retry)="loadEmployerOptions()"></app-request-feedback>
    <div *ngIf="listState.ready && assetOptions.length === 0" class="alert alert-warning">Add a <a routerLink="/asset-taxonomy/asset" class="alert-link">Asset</a> before creating a Component.</div>
    <!--begin::Table container-->
    <app-data-table
      [table]="table"
      [loading]="listState.loading()"
      [error]="listState.error()"
      [actionsDisabled]="actionsDisabled"
      [retryDisabled]="saving"
      emptyMessage="No components yet."
      (retry)="refresh()"
      tableId="kt_profile_overview_table"
      (editRecord)="openEditModal(componentModal, $event)"
      (deleteRecord)="table.confirmDelete($event, $event.name)">
    </app-data-table>
    <!--end::Table container-->
  </div>
  <!--end::Card body-->
</div>
<!--end::Card-->

<!--begin::Modal - Component (Add / Edit)-->
<ng-template #componentModal let-modal>
  <app-form-modal
    #formModal
    [title]="componentForm.id ? 'Edit Component' : 'Add Component'"
    [formId]="componentForm.id ? 'kt_modal_edit_component_form' : 'kt_modal_add_component_form'"
    [submitLabel]="componentForm.id ? 'Save' : 'Submit'"
    [saving]="saving"
    (dismiss)="modal.dismiss($event)">
    <form [id]="formModal.formId" [attr.aria-labelledby]="formModal.formId + '_title'" class="form" (ngSubmit)="submit(componentNgForm, modal)" #componentNgForm="ngForm" novalidate>
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_component'">
          <span class="required">Component Name</span>
        </label>
        <!--end::Label-->
        <input
          [id]="formModal.formId + '_component'"
          type="text"
          class="form-control form-control-solid"
          placeholder="Enter Component Name"
          name="component"
          [(ngModel)]="componentForm.name"
          required
          #componentControl="ngModel"
          [class.is-invalid]="componentControl.invalid && (componentControl.touched || componentNgForm.submitted)"
          [attr.aria-invalid]="(componentControl.invalid && (componentControl.touched || componentNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(componentControl.invalid && (componentControl.touched || componentNgForm.submitted)) ? (formModal.formId + '_component_error') : null"
          appTrimmedRequired />
        <div *ngIf="componentControl.invalid && (componentControl.touched || componentNgForm.submitted)" [id]="formModal.formId + '_component_error'" class="fv-plugins-message-container invalid-feedback d-block">Enter component name.</div>
      </div>
      <!--end::Input group-->
      <!--begin::Input group-->
      <div class="d-flex flex-column mb-8 fv-row">
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_tag'">Tag</label>
        <input [id]="formModal.formId + '_tag'" type="text" class="form-control form-control-solid" placeholder="Enter Tag Name" name="tag" [(ngModel)]="componentForm.tag" />
      </div>
      <div class="d-flex flex-column mb-15 fv-row">
        <!--begin::Label-->
        <label class="d-flex align-items-center fs-6 fw-semibold mb-2" [for]="formModal.formId + '_asset'">
          <span class="required">Asset Name</span>
        </label>
        <!--end::Label-->
        <select
          [id]="formModal.formId + '_asset'"
          class="form-select form-select-solid"
          data-control="select2"
          data-placeholder="Select an Asset"
          name="asset"
          [(ngModel)]="componentForm.assetId"
          required
          aria-label="Asset Name"
          #assetControl="ngModel"
          [class.is-invalid]="assetControl.invalid && (assetControl.touched || componentNgForm.submitted)"
          [attr.aria-invalid]="(assetControl.invalid && (assetControl.touched || componentNgForm.submitted)) ? 'true' : null"
          [attr.aria-describedby]="(assetControl.invalid && (assetControl.touched || componentNgForm.submitted)) ? (formModal.formId + '_asset_error') : null">
          <option [ngValue]="null">Select asset...</option>
          <option *ngFor="let s of assetOptions" [ngValue]="s.id">{{ s.label }}</option>
        </select>
        <div *ngIf="assetControl.invalid && (assetControl.touched || componentNgForm.submitted)" [id]="formModal.formId + '_asset_error'" class="fv-plugins-message-container invalid-feedback d-block">Select asset name.</div>
      </div>
      <!--end::Input group-->
    </form>
  </app-form-modal>
</ng-template>
<!--end::Modal - Component (Add / Edit)-->
