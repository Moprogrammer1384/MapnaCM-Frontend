<app-analysis-controls [tab]="tab" domain="frequency" dateSelectionTitle="Event date and time"
  [dateSelectionContent]="acquisition" [controlsContent]="settingsContent"></app-analysis-controls>
<ng-template #acquisition>
  <app-waterfall-acquisition-picker [inputId]="tab.id" [measurements]="tab.measurements" [value]="tab.waterfallEvent"
    (selected)="state.selectWaterfallEvent(tab.id, $event)"></app-waterfall-acquisition-picker>
</ng-template>
<ng-template #settingsContent>
  <div class="row g-5 mt-0">
    <div class="col-12 col-sm-6 col-lg-3">
      <label class="form-label" [for]="tab.id + '_quantity'">Quantity</label>
      <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
        [id]="tab.id + '_quantity'" [ngModel]="settings.quantity" (ngModelChange)="update('quantity', $event)">
        <option value="displacement">Displacement</option><option value="velocity">Velocity</option><option value="acceleration">Acceleration</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <label class="form-label" [for]="tab.id + '_unit'">Unit</label>
      <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
        [id]="tab.id + '_unit'" [ngModel]="settings.unit" (ngModelChange)="update('unit', $event)">
        @for (unit of units; track unit.value) { <option [value]="unit.value">{{ unit.value }}</option> }
      </select>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <label class="form-label" [for]="tab.id + '_frequency'">Frequency axis</label>
      <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
        [id]="tab.id + '_frequency'" [ngModel]="settings.xAxis" (ngModelChange)="update('xAxis', $event)">
        <option value="hz">Hz</option><option value="cpm">CPM</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <label class="form-label" [for]="tab.id + '_amplitude'">Amplitude</label>
      <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
        [id]="tab.id + '_amplitude'" [ngModel]="settings.amplitude" (ngModelChange)="update('amplitude', $event)">
        <option value="rms">RMS</option><option value="0p">0p</option><option value="pp">pp</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <label class="form-label" [for]="tab.id + '_window'">FFT window</label>
      <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
        [id]="tab.id + '_window'" [ngModel]="settings.window" (ngModelChange)="update('window', $event)">
        <option value="hann">Hann</option><option value="rectangular">Rectangular</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <label class="form-label" [for]="tab.id + '_depth'">Depth axis</label>
      <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
        [id]="tab.id + '_depth'" [ngModel]="settings.depthAxis" (ngModelChange)="update('depthAxis', $event)"
        [disabled]="eventType === 'SteadyState' || !hasSpeed">
        <option value="time">Elapsed time (s)</option><option value="rpm">Speed (RPM)</option>
      </select>
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <label class="form-label" [for]="tab.id + '_view'">Display</label>
      <select class="form-select form-select-solid" data-control="select2" data-hide-search="true"
        [id]="tab.id + '_view'" [ngModel]="settings.view" (ngModelChange)="update('view', $event)">
        <option value="waterfall">Waterfall</option><option value="map">Spectral map</option>
      </select>
    </div>
  </div>
</ng-template>
