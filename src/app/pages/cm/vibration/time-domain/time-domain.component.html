<app-analysis-workspace [state]="state" [measurementChartContent]="timeChart" [isMeasurementChartReady]="chartReady"
  [headerContent]="header"
  awaitingSelectionMessage="Select an event time above to display its waveform."></app-analysis-workspace>
<ng-template #timeChart let-item let-tab="tab">
    <app-vibration-time-domain-chart [measurementId]="item.measurement.id" [settings]="tab.chartSettings"
      [measurementIds]="tab.selection.measurementIds" [sourceKey]="tab.timeDomainEvent?.id"
      [recentSeconds]="tab.timeDomainRecentSeconds" [recentRevision]="tab.timeDomainRecentRevision"
      [onlineStartUtc]="tab.timeDomainOnlineStartUtc"
      (sourceProfile)="state.updateSourceProfile(tab.id, item.measurement.id, $event)"
      (sourceSettings)="initializeSettings(tab.id, $event)"
      [from]="range(tab).from" [to]="range(tab).to"></app-vibration-time-domain-chart>
</ng-template>

<ng-template #header let-tab>
  <app-time-domain-controls [tab]="tab"></app-time-domain-controls>
</ng-template>
